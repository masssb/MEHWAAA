```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Semangat Sekolah Mehwaa ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff7eb3,#ffc2d1);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#fff;
    overflow:hidden;
}

.card{
    width:85%;
    max-width:500px;
    background:rgba(255,255,255,.15);
    padding:40px 30px;
    border-radius:25px;
    text-align:center;
    backdrop-filter:blur(10px);
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

h1{
    font-size:38px;
    line-height:1.4;
    margin-bottom:15px;
}

p{
    font-size:18px;
    line-height:1.7;
    margin-bottom:30px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#fff;
    color:#ff4f81;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

button:hover{
    transform:scale(1.05);
}

.heart{
    position:fixed;
    top:-30px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

@media(max-width:600px){
    h1{
        font-size:30px;
    }

    p{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="card">

    <h1>
        📚❤️<br>
        Semangat Sekolah<br>
        Mehwaa
    </h1>

    <p>
        ada sedikit sesuatu buat kamu...<br>
        bukan hadiah yang mahal,<br>
        cuma sedikit kata-kata dari seseorang<br>
        yang pengen kamu tetap semangat hari ini 🤍
    </p>

    <button onclick="go()">
        💌 Buka Pesannya
    </button>

</div>

<script>

function go(){

    localStorage.setItem("playMusic","yes");

    window.location.href = "semangat.html";
}

setInterval(()=>{

    const h=document.createElement("div");

    h.className="heart";
    h.innerHTML=Math.random()>0.5 ? "❤️" : "🌷";

    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(18+Math.random()*18)+"px";
    h.style.animationDuration=(4+Math.random()*3)+"s";

    document.body.appendChild(h);

    setTimeout(()=>{
        h.remove();
    },7000);

},400);

</script>

</body>
</html>
```
